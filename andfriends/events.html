<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>&FRIENDS Admin — Events</title>
    <link rel="stylesheet" href="css/admin.css" />
    <style>
        /* Additional loading states */
        .admin-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
            color: var(--admin-muted);
        }
        
        .admin-loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--admin-border);
            border-top-color: var(--orange);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .admin-error {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
        }
        
        .admin-error-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .admin-error h3 {
            margin-bottom: 8px;
            color: var(--admin-text);
        }
        
        .admin-error p {
            color: var(--admin-muted);
            margin-bottom: 24px;
        }
        
        .retry-btn {
            background: var(--orange);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        
        .retry-btn:hover {
            opacity: 0.9;
        }
        
        .btn-secondary.active {
            background: var(--orange);
            color: white;
        }
    </style>
</head>

<body>

    <div id="sidebarMount"></div>

    <div class="admin-main">
        <header class="admin-topbar">
            <h1 class="admin-page-title">Events</h1>
            <div class="admin-topbar-actions">
                <button class="btn-secondary" onclick="filterEvents('all', this)">All</button>
                <button class="btn-secondary" onclick="filterEvents('published', this)">Published</button>
                <button class="btn-secondary" onclick="filterEvents('draft', this)">Drafts</button>
                <button class="btn-primary" onclick="openEventModal()">+ New Event</button>
            </div>
        </header>

        <main class="admin-content">
            <div class="admin-card">
                <!-- Loading state -->
                <div id="eventsLoadingState" class="admin-loading">
                    <div>
                        <div class="admin-loading-spinner"></div>
                        <div>Loading events...</div>
                        <div style="font-size: 12px; margin-top: 8px;">Connecting .... </div>
                    </div>
                </div>
                
                <!-- Error state -->
                <div id="eventsErrorState" class="admin-error" style="display: none;">
                    <div class="admin-error-icon">⚠️</div>
                    <h3>Failed to load events</h3>
                    <p>Could not connect to the database. Please check your connection and Firebase configuration.</p>
                    <button class="retry-btn" onclick="retryLoadEvents()">Retry</button>
                </div>
                
                <!-- Events table content -->
                <div id="eventsTableWrap" style="display: none;"></div>
            </div>
        </main>
    </div>

    <!-- EVENT MODAL -->
    <div class="admin-modal-backdrop" id="eventModal" style="display:none;">
        <div class="admin-modal" style="max-width:780px;">
            <div class="admin-modal-header">
                <h2 class="admin-modal-title" id="eventModalTitle">New Event</h2>
                <button class="admin-modal-close" onclick="closeAdminModal('eventModal')">✕</button>
            </div>
            <div class="admin-modal-body">

                <div class="form-grid form-grid-2">
                    <div class="form-field">
                        <label class="form-label">Event Title *</label>
                        <input type="text" id="evTitle" class="form-input" placeholder="e.g. Bongeziwe Mabandla" />
                    </div>
                    <div class="form-field">
                        <label class="form-label">Category / Tag *</label>
                        <select id="evTag" class="form-select">
                            <option value="Live Music">Live Music</option>
                            <option value="Afro Soul">Afro Soul</option>
                            <option value="Afro Jazz">Afro Jazz</option>
                            <option value="Food & Culture">Food & Culture</option>
                            <option value="Poetry & Spoken Word">Poetry & Spoken Word</option>
                            <option value="Art & Exhibition">Art & Exhibition</option>
                            <option value="Workshop">Workshop</option>
                            <option value="Community">Community</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label class="form-label">Date *</label>
                        <input type="date" id="evDate" class="form-input" />
                    </div>
                    <div class="form-field">
                        <label class="form-label">Time *</label>
                        <input type="text" id="evTime" class="form-input" placeholder="e.g. 19:00 – 22:00" />
                    </div>
                    <div class="form-field span-2">
                        <label class="form-label">Location</label>
                        <input type="text" id="evLocation" class="form-input" value="5 De Beer St, Braamfontein" />
                    </div>
                    <div class="form-field span-2">
                        <label class="form-label">Description *</label>
                        <textarea id="evDescription" class="form-textarea" rows="4"
                            placeholder="Describe this event…"></textarea>
                    </div>
                    <div class="form-field span-2">
                        <label class="form-label">Event Image</label>
                        <div class="upload-zone" id="evImgZone">
                            <input type="file" accept="image/*" onchange="handleEventImageUpload(this)" />
                            <div class="upload-zone-icon">🖼</div>
                            <div class="upload-zone-text"><strong>Click to upload</strong> or drag & drop<br>JPG, PNG,
                                WEBP up to 5MB</div>
                        </div>
                        <div id="evImgPreview" style="margin-top:10px;"></div>
                    </div>
                </div>

                <!-- Lineup -->
                <div style="margin-top:28px;">
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
                        <label class="form-label" style="margin:0;">Lineup</label>
                        <button type="button" class="btn-secondary btn-sm" onclick="addLineupRow()">+ Add</button>
                    </div>
                    <div id="lineupRows"></div>
                </div>

                <!-- Ticket tiers -->
                <div style="margin-top:28px;">
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
                        <label class="form-label" style="margin:0;">Ticket Tiers</label>
                        <button type="button" class="btn-secondary btn-sm" onclick="addTicketRow()">+ Add Tier</button>
                    </div>
                    <div id="ticketRows"></div>
                </div>

                <!-- Status / Featured -->
                <div class="form-grid form-grid-2" style="margin-top:28px;">
                    <div class="form-field">
                        <label class="form-label">Status</label>
                        <select id="evStatus" class="form-select">
                            <option value="draft">Draft</option>
                            <option value="published">Published</option>
                        </select>
                    </div>
                    <div class="form-field" style="justify-content:flex-end;">
                        <label class="form-label">&nbsp;</label>
                        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 0;">
                            <input type="checkbox" id="evFeatured"
                                style="width:16px;height:16px;accent-color:var(--orange);" />
                            <span style="font-size:14px;">Feature on homepage</span>
                        </label>
                    </div>
                </div>

            </div>
            <div class="admin-modal-footer">
                <button class="btn-secondary" onclick="closeAdminModal('eventModal')">Cancel</button>
                <button class="btn-primary" onclick="saveEvent()">Save Event</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>

    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-store.js"></script>
    <script src="js/admin-core.js"></script>
    <script src="js/events-admin.js"></script>
    
    <script>
        // Listen for events load completion from events-admin.js
        document.addEventListener('af:eventsLoaded', function() {
            const loadingDiv = document.getElementById('eventsLoadingState');
            const errorDiv = document.getElementById('eventsErrorState');
            const tableWrap = document.getElementById('eventsTableWrap');
            
            if (loadingDiv) loadingDiv.style.display = 'none';
            if (errorDiv) errorDiv.style.display = 'none';
            if (tableWrap) tableWrap.style.display = 'block';
        });
        
        // Listen for events load error
        document.addEventListener('af:eventsError', function(e) {
            const loadingDiv = document.getElementById('eventsLoadingState');
            const errorDiv = document.getElementById('eventsErrorState');
            const tableWrap = document.getElementById('eventsTableWrap');
            
            if (loadingDiv) loadingDiv.style.display = 'none';
            if (tableWrap) tableWrap.style.display = 'none';
            if (errorDiv) {
                errorDiv.style.display = 'flex';
                // Optionally show specific error message
                const errorMsg = errorDiv.querySelector('p');
                if (errorMsg && e.detail?.error) {
                    errorMsg.textContent = e.detail.error;
                }
            }
        });
        
        // Listen for load start
        document.addEventListener('af:eventsLoadStart', function() {
            const loadingDiv = document.getElementById('eventsLoadingState');
            const errorDiv = document.getElementById('eventsErrorState');
            const tableWrap = document.getElementById('eventsTableWrap');
            
            if (loadingDiv) loadingDiv.style.display = 'flex';
            if (errorDiv) errorDiv.style.display = 'none';
            if (tableWrap) tableWrap.style.display = 'none';
        });
    </script>
</body>

</html>

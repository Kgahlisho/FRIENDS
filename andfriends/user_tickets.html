<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>&FRIENDS — My Tickets</title>
    <link rel="stylesheet" href="css/admin.css" />
    <link rel="stylesheet" href="css/event_detail.css" />
    <link rel="stylesheet" href="css/user-tickets.css" />
</head>

<body>

    <aside class="admin-sidebar">
        <div class="admin-sidebar-brand">
            <div class="brand-amp">&amp;</div>
            <div class="brand-name">FRIENDS</div>
            <span class="brand-role">Resident Portal</span>
        </div>
        <nav class="admin-nav">
            <div class="admin-nav-section-label">My Account</div>
            <a href="user_dashboard.html"><span>🏠</span> Dashboard</a>
            <a href="user_tickets.html" class="active"><span>🎟</span> My Tickets</a>
            <a href="user_profile.html"><span>👤</span> My Profile</a>
            <div class="admin-nav-section-label" style="margin-top:8px;">Explore</div>
            <a href="#" onclick="showEventsSection(); return false;"><span>🗓</span> Browse Events</a>
            <a href="html/gallery.html"><span>🖼</span> Gallery</a>
            <a href="html/index.html"><span>🏡</span> Back to Website</a>
        </nav>
        <div class="admin-sidebar-footer">
            <div class="admin-sidebar-user" id="sidebarUser"></div>
            <button class="btn-logout" onclick="handleLogout()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                Log Out
            </button>
        </div>
    </aside>

    <div class="admin-main">
        <header class="admin-topbar">
            <h1 class="admin-page-title" id="pageTitle">My Tickets</h1>
            <div class="admin-topbar-actions">
                <div id="filterContainer">
                    <select id="filterStatus" class="form-select" style="width:160px;" title="Filter by status"
                        onchange="applyTicketFilter()">
                        <option value="all">All Tickets</option>
                        <option value="active">Active</option>
                        <option value="used">Used</option>
                    </select>
                </div>
                <button class="btn-primary" onclick="showEventsSection()">+ Browse Events</button>
            </div>
        </header>

        <main class="admin-content">
            <!-- Tickets View -->
            <div id="ticketsView">
                <div class="stats-grid" id="ticketStats" style="grid-template-columns:repeat(3,1fr);margin-bottom:28px;">
                </div>
                <div class="ticket-grid" id="ticketGrid"></div>
            </div>

            <!-- Events View (Browse Events) -->
            <div id="eventsView" style="display: none;">
                <div class="admin-card">
                    <div class="admin-card-header">
                        <span class="admin-card-title">Browse Events</span>
                        <button class="btn-secondary btn-sm" onclick="showTicketsView()">← Back to My Tickets</button>
                    </div>
                    <div class="admin-card-body">
                        <div class="filter-bar" id="filterBar">
                            <button class="filter-chip active" data-filter="all" onclick="filterBrowseEvents('all')">All Events</button>
                            <button class="filter-chip" data-filter="Live Music" onclick="filterBrowseEvents('Live Music')">Live Music</button>
                            <button class="filter-chip" data-filter="Afro Soul" onclick="filterBrowseEvents('Afro Soul')">Afro Soul</button>
                            <button class="filter-chip" data-filter="Afro Jazz" onclick="filterBrowseEvents('Afro Jazz')">Afro Jazz</button>
                            <button class="filter-chip" data-filter="Food & Culture" onclick="filterBrowseEvents('Food & Culture')">Food & Culture</button>
                            <button class="filter-chip" data-filter="Workshop" onclick="filterBrowseEvents('Workshop')">Workshop</button>
                        </div>
                        <div id="browseEventsGrid" class="browse-events-grid">
                            <div class="events-loading">Loading events...</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Ticket View Modal (Large QR for scanning) -->
    <div id="ticketViewModal" class="ticket-view-modal" style="display: none;">
        <div class="ticket-modal-container">
            <div class="ticket-modal-content">
                <div class="ticket-modal-header">
                    <span class="ticket-modal-logo">&amp;FRIENDS</span>
                    <span class="ticket-modal-badge" id="modalTicketTag">LIVE EVENT</span>
                    <button class="ticket-modal-close" onclick="closeTicketModal()">✕</button>
                </div>
                <div class="ticket-modal-body">
                    <h2 class="ticket-modal-title" id="modalTicketTitle"></h2>
                    <div class="ticket-modal-meta" id="modalTicketMeta"></div>
                    
                    <div class="qr-large-container">
                        <div id="modalLargeQR"></div>
                    </div>
                    
                    <div class="ticket-details-grid" id="modalTicketDetails"></div>
                </div>
                <div class="ticket-modal-footer">
                    <button class="btn-download-ticket" onclick="downloadTicketAsImage()">📥 Download</button>
                    <button class="btn-print-ticket" onclick="printTicket()">🖨 Print Ticket</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>

    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-store.js"></script>
    <script src="js/user-tickets.js"></script>
</body>

</html>
